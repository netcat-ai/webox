name: Adapter release

on:
  push:
    branches:
      - "codex/wechat-image-release-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: adapter-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  WEBOX_RUNTIME_IMAGE: ghcr.io/netcat-ai/webox@sha256:5cfe933926b7c8622293c770b4bc6883dfd3e2a5b20413d531062962a018907f

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Go adapter
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish adapter with fixed runtime
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: WEBOX_RUNTIME_IMAGE=${{ env.WEBOX_RUNTIME_IMAGE }}
          tags: ${{ env.IMAGE_NAME }}:adapter-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=webox-adapter-arm64
          cache-to: type=gha,mode=max,scope=webox-adapter-arm64
      - name: Verify preserved WeChat version
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$image"
          version="$(docker run --rm --entrypoint cat "$image" /webox/wechat/.webox-version)"
          test "$version" = '4.1.1.8'
          printf 'Image: `%s`\n\nWeChat: `%s`\n' "$image" "$version" >> "$GITHUB_STEP_SUMMARY"
